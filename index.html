<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI in Practice FA26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/src/styles/index.css">
</head>
<body>

<header class="top light">
  <glass-element auto-size radius="26" blur="3" strength="30" depth="6" background-color="rgba(255,255,255,0.62)">
    <div class="bar">
      <nav class="nav" aria-label="Menu">
        <button class="lang" type="button" id="langBtn"></button>
        <a class="btn btn-primary btn-sm" href="#dang-ky" data-i18n="nav.cta"></a>
      </nav>
    </div>
  </glass-element>
</header>

<main id="top">
  <section class="hero2" id="hero">
    <div class="hero2-inner">
      <div class="hero-copy">
        <h1 data-i18n-html="hero.title"></h1>
        <p class="slogan" data-i18n-html="hero.slogan"></p>
        <p class="sub" data-i18n="hero.sub"></p>
        <div class="cta-row">
          <a class="btn btn-primary" href="#dang-ky" data-i18n="hero.cta"></a>
          <glass-element class="glass-cta" auto-size radius="26" blur="2" strength="60" depth="10" chromatic-aberration="2" background-color="rgba(255,255,255,0.55)"><a href="#noi-dung" data-i18n="hero.cta2"></a></glass-element>
        </div>
      </div>
      <div class="hero-art" id="heroArt" aria-hidden="true"><canvas></canvas><div class="h-tags"></div></div>
    </div>
  </section>

  <div class="after-hero">
  <section class="band" id="gia-tri"><!-- không dùng .glow: phần này phủ lên hero khi chuyển cảnh, quầng cam bị cắt thành mảng mờ -->
    <div class="inner">
      <div class="sec-head rv">
        <span class="eyebrow" data-i18n="val.eyebrow"></span>
        <h2 data-i18n="val.title"></h2>
        <p class="lead" data-i18n="val.lead"></p>
      </div>
      <div class="lab rv">
        <div class="lab-tabs" role="tablist"><button class="lab-tab" role="tab" data-k="0"><span class="lt-n">01</span><span class="lt-k" data-i18n="val.k1"></span><span class="lt-h" data-i18n="val.h1"></span><span class="lt-p" data-i18n="val.p1"></span></button><button class="lab-tab" role="tab" data-k="1"><span class="lt-n">02</span><span class="lt-k" data-i18n="val.k2"></span><span class="lt-h" data-i18n="val.h2"></span><span class="lt-p" data-i18n="val.p2"></span></button><button class="lab-tab" role="tab" data-k="2"><span class="lt-n">03</span><span class="lt-k" data-i18n="val.k3"></span><span class="lt-h" data-i18n="val.h3"></span><span class="lt-p" data-i18n="val.p3"></span></button></div>
        <div class="lab-app" id="modArt"></div>
      </div>
    </div>
  </section>

  </div>

  <section class="band" id="noi-dung">
    <div class="inner">
      <div class="sec-head stairs-head rv"><span class="eyebrow" data-i18n="mods.eyebrow"></span><h2 data-i18n="mods.title"></h2></div>
      <ol class="stairs"><li class="step s1" style="--i:0" tabindex="0"><span class="n">1</span><h3 data-i18n="top.t1"></h3><p data-i18n="top.d1"></p><p class="out"><b data-i18n="top.out"></b> <span data-i18n="top.o1"></span></p></li><li class="step s2" style="--i:1" tabindex="0"><span class="n">2</span><h3 data-i18n="top.t2"></h3><p data-i18n="top.d2"></p><p class="out"><b data-i18n="top.out"></b> <span data-i18n="top.o2"></span></p></li><li class="step s3" style="--i:2" tabindex="0"><span class="n">3</span><h3 data-i18n="top.t3"></h3><p data-i18n="top.d3"></p><p class="out"><b data-i18n="top.out"></b> <span data-i18n="top.o3"></span></p></li><li class="step s4" style="--i:3" tabindex="0"><span class="n">4</span><h3 data-i18n="top.t4"></h3><p data-i18n="top.d4"></p><p class="out"><b data-i18n="top.out"></b> <span data-i18n="top.o4"></span></p></li><li class="step s5" style="--i:4" tabindex="0"><span class="n">5</span><h3 data-i18n="top.t5"></h3><p data-i18n="top.d5"></p><p class="out"><b data-i18n="top.out"></b> <span data-i18n="top.o5"></span></p></li><li class="step s6" style="--i:5" tabindex="0"><svg class="cup" viewBox="0 0 64 64" aria-hidden="true"><path class="cup-h" d="M18 14H8v6c0 7 5 12 12 13M46 14h10v6c0 7-5 12-12 13"/><path class="cup-b" d="M18 8h28v14c0 10-6 17-14 17s-14-7-14-17z"/><path class="cup-s" d="M26 13v9c0 4 2 7 4 8"/><path class="cup-b" d="M28 39h8v8h-8zM20 47h24l2 9H18z"/></svg><span class="n">6</span><h3 data-i18n="top.t6"></h3><p data-i18n="top.d6"></p><p class="out"><b data-i18n="top.out"></b> <span data-i18n="top.o6"></span></p></li></ol>
    </div>
  </section>

  <section class="band glow reg" id="dang-ky">
    <div class="inner">

      <div class="reg-cta rv">
        <h2 data-i18n="r.ctaT"></h2>
        <p class="r-lead" data-i18n="r.ctaP"></p>
        <button type="button" class="btn btn-primary reg-go" id="gBtn"><span data-i18n="r.join"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <p class="err" id="e-login" role="alert"></p>
      </div>

      <dialog class="reg-dlg" id="regDlg" aria-labelledby="regDlgT">
        <form id="regForm" novalidate>
          <div class="dlg-head">
            <h2 id="regDlgT" data-i18n="r.title"></h2>
            <button type="button" class="dlg-x" id="regClose"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span class="sr-only" data-i18n="r.close"></span></button>
          </div>
          <div class="r-pane" id="rInfo" hidden>
            <div class="acct">
              <span class="av" id="acAv"></span>
              <span class="ac-t">
                <b id="acName"></b>
                <span class="ac-mail"><span class="ac-ok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span class="sr-only" data-i18n="r.verified"></span></span><small id="acMail"></small></span>
              </span>
              <button type="button" class="ac-sw" id="acSwitch" data-i18n="r.switch"></button>
            </div>

            <div class="field">
              <label for="f-id"><span data-i18n="f.id"></span> <span class="req">*</span></label>
              <input id="f-id" name="studentId" type="text" placeholder="SE123456" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-describedby="h-id e-id">
              <span class="hint" id="h-id" data-i18n="f.idHint"></span>
              <span class="err" id="e-id"></span>
            </div>

            <div class="pick-row">
              <div class="field">
                <label for="f-major"><span data-i18n="r.major"></span> <span class="req">*</span></label>
                <select id="f-major" name="major" aria-describedby="e-major" data-placeholder>
                  <option value="" data-i18n="f.majorPick"></option>
                  <option value="SE" data-i18n="m.se"></option>
                  <option value="AI" data-i18n="m.ai"></option>
                  <option value="IA" data-i18n="m.ia"></option>
                  <option value="IS" data-i18n="m.is"></option>
                  <option value="OTHER" data-i18n="m.other"></option>
                </select>
                <span class="err" id="e-major"></span>
              </div>
              <div class="field">
                <label for="f-term"><span data-i18n="f.term"></span> <span class="req">*</span></label>
                <select id="f-term" name="term" aria-describedby="e-term" data-placeholder><option value="" data-i18n="f.termPick"></option></select>
                <span class="err" id="e-term"></span>
              </div>
            </div>

            <div class="pledge-box">
              <b data-i18n="f.pledge"></b>
              <div class="pledge-list" data-i18n-html="f.pledgeText"></div>
              <label class="tick"><input type="checkbox" id="c-pledge"> <span><span data-i18n="f.pledgeTick"></span> <span class="req">*</span></span></label>
            </div>

            <div class="submit-row">
              <button class="btn btn-primary" type="submit" id="submitBtn" disabled><span data-i18n="f.submit"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
              <p class="hint" id="submitHint" aria-live="polite"></p>
            </div>
          </div>

          <div class="done" id="done" hidden tabindex="-1">
            <span class="ok"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span>
            <h3 id="doneTitle"></h3>
            <p id="doneText"></p>
            <dl class="done-sum" id="doneSum"></dl>
            <p class="demo-note" data-i18n="f.demo"></p>
            <div><button class="btn btn-sm btn-ghost" type="button" id="againBtn" data-i18n="f.again"></button></div>
          </div>
        </form>
      </dialog>


      <div class="g-mock" id="gMock" hidden role="dialog" aria-modal="true" aria-labelledby="gmT">
        <div class="gm-card">
          <div class="gm-top"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.2-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-10l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/></svg><span class="demo-note" data-i18n="r.mockTag"></span></div>
          <h3 id="gmT" data-i18n="r.mockT"></h3>
          <div class="field"><label for="gm-name" data-i18n="f.name"></label><input id="gm-name" type="text" autocomplete="name" data-i18n-ph="f.namePh"></div>
          <div class="field"><label for="gm-mail" data-i18n="r.gmail"></label><input id="gm-mail" type="email" autocomplete="email" placeholder="ten@gmail.com"></div>
          <div class="gm-act"><button type="button" class="btn btn-sm btn-ghost" id="gmCancel" data-i18n="r.cancel"></button><button type="button" class="btn btn-sm btn-primary" id="gmOk" data-i18n="r.next"></button></div>
        </div>
      </div>
    </div>
  </section>

  <section class="band" id="faq">
    <div class="inner">
      <div class="sec-head rv">
        <span class="eyebrow" data-i18n="faq.eyebrow"></span>
        <h2 data-i18n="faq.title"></h2>
      </div>
      <div class="faq rv">
        <details><summary data-i18n="faq.q1"></summary><p data-i18n="faq.a1"></p></details>
        <details><summary data-i18n="faq.q2"></summary><p data-i18n="faq.a2"></p></details>
        <details><summary data-i18n="faq.q3"></summary><p data-i18n="faq.a3"></p></details>
        <details><summary data-i18n="faq.q4"></summary><p data-i18n="faq.a4"></p></details>
      </div>
    </div>
  </section>
</main>

<footer class="band">
  <div class="inner">
    <div><span class="muted">AI-Augmented Software Engineering · FPT University · FA26</span></div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@real-human/liquid-glass@1.2.0/dist/liquid-glass.umd.js"></script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
