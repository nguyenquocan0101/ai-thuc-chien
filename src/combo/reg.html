      <div class="reg-wrap">
        <form id="regForm" class="rv" novalidate>
          <div class="reg-head">
            <h2 data-i18n="r.title"></h2>
          </div>
          <div class="r-pane" id="rLogin">
            <button type="button" class="g-btn" id="gBtn"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.2-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-10l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/></svg><span data-i18n="r.google"></span></button>
            <p class="err" id="e-login" role="alert"></p>
            <p class="r-note"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-i18n="r.loginNote"></span></p>
          </div>

          <div class="r-pane" id="rInfo" hidden>
            <div class="acct"><span class="av" id="acAv"></span><span class="ac-t"><b id="acName"></b><small id="acMail"></small></span><span class="ac-ok" data-i18n="r.verified"></span><button type="button" class="ac-sw" id="acSwitch" data-i18n="r.switch"></button></div>
            <div class="fgrid r-grid">
              <div class="field full">
                <label for="f-id"><span data-i18n="f.id"></span> <span class="req">*</span></label>
                <input id="f-id" name="studentId" type="text" placeholder="SE123456" autocapitalize="characters" aria-describedby="h-id e-id">
                <span class="hint" id="h-id" data-i18n="f.idHint"></span>
                <span class="err" id="e-id"></span>
              </div>
              <div class="field">
                <label for="f-major"><span data-i18n="r.major"></span> <span class="req">*</span></label>
                <select id="f-major" name="major" aria-describedby="e-major">
                  <option value="" data-i18n="f.majorPick"></option>
                  <option value="SE" data-i18n="m.se"></option>
                  <option value="AI" data-i18n="m.ai"></option>
                  <option value="IA" data-i18n="m.ia"></option>
                  <option value="IS" data-i18n="m.is"></option>
                  <option value="OTHER" data-i18n="m.other"></option>
                </select>
                <span class="err" id="e-major"></span>
              </div>
              <div class="field">
                <label for="f-term"><span data-i18n="f.term"></span> <span class="req">*</span></label>
                <select id="f-term" name="term" aria-describedby="e-term"><option value="" data-i18n="f.termPick"></option></select>
                <span class="err" id="e-term"></span>
              </div>
            </div>

            <div class="rules-box">
              <details class="rules" id="rules">
                <summary><span class="rb-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></svg></span><span class="rb-t"><b data-i18n="f.pledge"></b><small id="rulesSum"></small></span><i class="chev" aria-hidden="true"></i></summary>
                <div class="rules-body" data-i18n-html="f.pledgeText"></div>
              </details>
              <label class="tick"><input type="checkbox" id="c-pledge" disabled> <span><span data-i18n="f.pledgeTick"></span> <span class="req">*</span></span></label>
            </div>

            <div class="submit-row">
              <p class="hint" id="submitHint"></p>
              <button class="btn btn-primary" type="submit" id="submitBtn" disabled data-i18n="f.submit"></button>
            </div>
          </div>

          <div class="done" id="done" hidden tabindex="-1">
            <span class="ok"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span>
            <h3 id="doneTitle"></h3>
            <p id="doneText"></p>
            <dl class="done-sum" id="doneSum"></dl>
            <p class="demo-note" data-i18n="f.demo"></p>
            <div><button class="btn btn-sm btn-ghost" type="button" id="againBtn" data-i18n="f.again"></button></div>
          </div>
        </form>
      </div>

      <div class="rules-page" id="rulesPage" hidden role="dialog" aria-modal="true" aria-labelledby="rpT">
        <div class="rp-bar"><button type="button" class="rp-back" id="rpBack"><span aria-hidden="true">←</span> <span data-i18n="r.back"></span></button><span class="rp-step" data-i18n="r.s3"></span></div>
        <div class="rp-body"><span class="eyebrow" data-i18n="reg.eyebrow"></span><h2 id="rpT" data-i18n="f.pledge"></h2><div class="rules-body" data-i18n-html="f.pledgeText"></div></div>
        <div class="rp-foot"><button type="button" class="btn btn-primary" id="rpAgree" data-i18n="r.agree"></button></div>
      </div>

      <div class="g-mock" id="gMock" hidden role="dialog" aria-modal="true" aria-labelledby="gmT">
        <div class="gm-card">
          <div class="gm-top"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.2-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-10l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/></svg><span class="demo-note" data-i18n="r.mockTag"></span></div>
          <h3 id="gmT" data-i18n="r.mockT"></h3>
          <div class="field"><label for="gm-name" data-i18n="f.name"></label><input id="gm-name" type="text" autocomplete="name" data-i18n-ph="f.namePh"></div>
          <div class="field"><label for="gm-mail" data-i18n="r.gmail"></label><input id="gm-mail" type="email" autocomplete="email" placeholder="ten@fpt.edu.vn"></div>
          <div class="gm-act"><button type="button" class="btn btn-sm btn-ghost" id="gmCancel" data-i18n="r.cancel"></button><button type="button" class="btn btn-sm btn-primary" id="gmOk" data-i18n="r.next"></button></div>
        </div>
      </div>
